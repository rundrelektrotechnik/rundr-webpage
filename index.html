<!DOCTYPE html>
<html lang="de">
<head>

<body>
    <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur">
        <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8" aria-label="Hauptnavigation">
            <a href="/" class="flex items-center gap-3 text-lg font-semibold text-slate-900">
                <span class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-slate-900 text-sm font-bold text-white">Logo</span>

            <div class="hidden md:flex md:items-center md:gap-6">

            <button type="button" class="inline-flex items-center justify-center rounded-md p-2 text-slate-700 transition-colors hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 md:hidden" aria-label="Menü öffnen" aria-expanded="false">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">

    <section id="hero" class="bg-slate-900 text-white">

            Meisterbetrieb für Elektrotechnik &amp; Installation

          </p>
          <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:gap-4">
            <a href="#kontakt" class="inline-flex items-center justify-center rounded-lg bg-amber-400 px-6 py-3 text-base font-semibold text-slate-900 shadow-sm transition-colors hover:bg-amber-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-400 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900">
